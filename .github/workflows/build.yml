# Builds the GraalVM native image of the CLI from the tip of the main repository,
# then packages the Tauri app around it on each supported platform.

name: Build apps

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: xcode-27
            artifact: macos-arm64
            bundles: app
          - name: Linux x86_64
            os: ubuntu-24.04
            artifact: linux-x86_64
            bundles: deb,rpm,appimage
          - name: Linux arm64
            os: ubuntu-24.04-arm
            artifact: linux-arm64
            bundles: deb,rpm,appimage
          - name: Windows x86_64
            os: windows-latest
            artifact: windows-x86_64
            bundles: nsis

    steps:
      - uses: actions/checkout@v7
        with:
          path: gui

      - name: Check out the CLI (tip of the default branch)
        uses: actions/checkout@v7
        with:
          repository: dontwanttothink/2016699
          path: cli

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm-community"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show the Xcode version
        if: runner.os == 'macOS'
        run: xcodebuild -version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the native CLI
        working-directory: cli
        run: ./gradlew :app:nativeCompile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - name: Place the CLI as a Tauri sidecar
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          mkdir -p gui/src-tauri/binaries
          cp "cli/app/build/native/nativeCompile/graduation$ext" \
            "gui/src-tauri/binaries/graduation-$triple$ext"

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          package_json_file: gui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: gui
        run: pnpm install --frozen-lockfile

      # Works around actool failing with "Bad file descriptor" under Tauri.
      - name: Use the actool wrapper
        if: runner.os == 'macOS'
        run: echo "$GITHUB_WORKSPACE/gui/scripts/macos" >> "$GITHUB_PATH"

      - name: Build the app
        if: runner.os != 'Windows'
        working-directory: gui
        env:
          # Ad-hoc signature: Apple Silicon refuses to run unsigned bundles.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Build the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: gui
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      # upload-artifact drops file permissions, so the .app is zipped first.
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        working-directory: gui/src-tauri/target/release/bundle/macos
        run: ditto -c -k --keepParent *.app app.zip

      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: gui/src-tauri/target/release/bundle/macos/app.zip
          if-no-files-found: error

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            gui/src-tauri/target/release/bundle/deb/*.deb
            gui/src-tauri/target/release/bundle/rpm/*.rpm
            gui/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: gui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
